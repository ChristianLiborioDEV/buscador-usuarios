<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Usuários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="buscador" class="hero">
        <h1>BUSCADOR DE USUÁRIOS</h1>
        <input type="number" name="Entrada" id="inputEntrada" min="0" placeholder="Digite o ID"> <button>Buscar</button>
    </div>

    <div id="loading" class="escondido">
        <h2>CARREGANDO</h2>
    </div>
    <div id="erro" class="escondido">
        <h2>ERRO!</h2>
    </div>
    <div id="card" class="escondido">
        <h2>USUÁRIO</h2>
    </div>
    <script src="app.js"></script>
</body>
</html>
